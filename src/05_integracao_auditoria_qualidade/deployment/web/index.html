<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concierge ConectaTel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <p class="eyebrow">DEMONSTRAÇÃO INTERNA</p>
      <h1>Concierge ConectaTel</h1>
      <p class="intro">Faça perguntas sobre planos, políticas e procedimentos da ConectaTel.</p>
      <form id="question-form">
        <label for="question">Sua pergunta</label>
        <textarea id="question" maxlength="800" required placeholder="Ex.: Qual é o prazo para pedir reembolso?"></textarea>
        <button id="submit-button" type="submit">Consultar</button>
      </form>
      <section id="result" class="result hidden" aria-live="polite"></section>
    </main>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
