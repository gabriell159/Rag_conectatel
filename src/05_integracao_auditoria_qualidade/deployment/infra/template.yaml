AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: API interna de demonstração do Concierge ConectaTel.

Parameters:
  RagBucketName:
    Type: String
    Description: Bucket que contém o vector store oficial.
  AuditBucketName:
    Type: String
    Description: Bucket que receberá os eventos de auditoria.
  S3Prefix:
    Type: String
    Default: conectatel
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: URL do Amplify autorizada a chamar a API.
  BedrockModelId:
    Type: String
    Default: mistral.mistral-large-3-675b-instruct
  AuditCallbackUrl:
    Type: String
    Description: URL HTTPS da pagina audit.html publicada no Amplify.
  AuditUserPoolDomainPrefix:
    Type: String
    Description: Prefixo globalmente unico para o dominio Cognito da console de auditoria.

Resources:
  DemoEnabledParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /conectatel/demo/enabled
      Type: String
      Value: "false"
      Description: Liga ou desliga a demonstração interna do Concierge.

  ConciergeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
      Auth:
        Authorizers:
          AuditJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              audience:
                - !Ref AuditUserPoolClient
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${AuditUserPool}"

  AuditUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-audit-admin"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  AuditUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AuditUserPool
      ClientName: !Sub "${AWS::StackName}-audit-web"
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [implicit]
      AllowedOAuthScopes: [openid]
      CallbackURLs: [!Ref AuditCallbackUrl]
      LogoutURLs: [!Ref AuditCallbackUrl]
      SupportedIdentityProviders: [COGNITO]

  AuditUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref AuditUserPoolDomainPrefix
      UserPoolId: !Ref AuditUserPool

  AuditAuditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: auditor
      Description: Usuários autorizados a consultar rastros de auditoria.
      UserPoolId: !Ref AuditUserPool

  ConciergeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerTag: concierge-demo-v1
      DockerContext: ../../../../
      Dockerfile: src/05_integracao_auditoria_qualidade/deployment/lambda/Dockerfile
    Properties:
      PackageType: Image
      MemorySize: 2048
      Timeout: 60
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref RagBucketName
          S3_PREFIX: !Ref S3Prefix
          RAG_VECTORSTORE_PATH: /tmp/conectatel-vectorstore
          RAG_VECTORSTORE_VERSION: v1
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ABSTENTION_THRESHOLD: "0.30"
          AUDIT_S3_BUCKET: !Ref AuditBucketName
          AUDIT_S3_PREFIX: !Sub "${S3Prefix}/audit"
          AUDIT_LOG_PATH: /tmp/audit_log.jsonl
          DEMO_ENABLED_PARAMETER: !Ref DemoEnabledParameter
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        # Permite registrar a causa de falhas de execução na CloudWatch.
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action: [s3:ListBucket]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${RagBucketName}"
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${RagBucketName}/${S3Prefix}/*"
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${AuditBucketName}/${S3Prefix}/audit/*"
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${AuditBucketName}/${S3Prefix}/audit/*"
            - Effect: Allow
              Action: [s3:ListBucket]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${AuditBucketName}"
              Condition:
                StringLike:
                  s3:prefix: !Sub "${S3Prefix}/audit/*"
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/conectatel/demo/enabled"
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/*"
      Events:
        Ask:
          Type: HttpApi
          Properties:
            ApiId: !Ref ConciergeApi
            Path: /ask
            Method: POST
        Audit:
          Type: HttpApi
          Properties:
            ApiId: !Ref ConciergeApi
            Path: /audit
            Method: POST
            Auth:
              Authorizer: AuditJwtAuthorizer
        AuditRecent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ConciergeApi
            Path: /audit/recent
            Method: POST
            Auth:
              Authorizer: AuditJwtAuthorizer

Outputs:
  ApiUrl:
    Description: URL POST da API para configurar na interface Amplify.
    Value: !Sub "https://${ConciergeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/ask"
  DemoEnabledParameterName:
    Value: !Ref DemoEnabledParameter
  AuditApiUrl:
    Description: URL POST protegida para consultar uma interacao por trace_id.
    Value: !Sub "https://${ConciergeApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/audit"
  AuditUserPoolId:
    Value: !Ref AuditUserPool
  AuditUserPoolClientId:
    Value: !Ref AuditUserPoolClient
  AuditUserPoolDomain:
    Description: Dominio Cognito sem o sufixo .auth da console administrativa.
    Value: !Ref AuditUserPoolDomainPrefix
  AuditHostedUiLoginUrl:
    Description: Login Cognito da console administrativa.
    Value: !Sub "https://${AuditUserPoolDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/login?client_id=${AuditUserPoolClient}&response_type=token&scope=openid&redirect_uri=${AuditCallbackUrl}"
